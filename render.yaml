services:
  - type: web
    runtime: static
    name: cintia-godoy
    repo: https://github.com/Lopesloro/cintia-godoy
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    # Os dominios vivem no painel do servico, nao aqui: declarar no blueprint faz
    # qualquer outro servico ligado a este repo tentar reivindicar os mesmos nomes.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
