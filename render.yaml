services:
  - type: web
    runtime: static
    name: cintia-godoy
    repo: https://github.com/Lopesloro/cintia-godoy
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
